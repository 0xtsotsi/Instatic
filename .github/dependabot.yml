# Dependabot version updates.
#
# Cadence: weekly for both ecosystems. Grouped by minor/patch so a single PR
# covers routine dependency refreshes; GitHub Actions major bumps (e.g.
# checkout @v4 -> @v7) still surface as their own PR.
#
# `npm` covers package.json + bun.lock — bun uses the npm registry, and
# Dependabot reads bun.lock for the dependency graph.

version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 3
